<body>

    <div class="promo-overlay" id="promoModal">

            <div class="cylinder-text">求籤</div>
        </div>
        <div class="hand-guide" id="handGuide">
            <svg viewBox="0 0 24 24" fill="white"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.28-.06-.58.02-.81.21l-1.63 1.53 4.58 4.59c.29.29.68.45 1.09.45h9.26c.68 0 1.27-.45 1.44-1.1l1.34-5.36c.21-.85-.43-1.69-1.28-1.84z"/></svg>
        </div>
    </div>

    <p class="hint" id="hintText">👆點擊籤筒求一支籤</p>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <img id="resultImage" class="result-image" src="" alt="運勢結果">
            <div class="save-hint">（長按圖片即可儲存到相簿）</div>
            <div class="modal-buttons-container">
                <div class="btn-row">
                    <button class="action-btn line-btn" onclick="shareToLine()">LINE分享</button>
                    <a id="downloadLink" class="action-btn download-btn" href="#" download="我的運勢籤.png">下載圖片</a>
                    <a class="action-btn event-btn" href="https://www.agoood.com/2026-wdsd" target="_blank">活動網頁</a>
                </div>
                <div class="btn-row">
                    <button class="action-btn close-btn" onclick="closeModal()">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fortuneImages = ['1.png', '2.png', '3.png', '4.png']; [cite: 127, 128]
        const shaker = document.getElementById('shaker'); [cite: 128]
        const modal = document.getElementById('modal'); [cite: 128]
        const resultImage = document.getElementById('resultImage'); [cite: 128]
        const downloadLink = document.getElementById('downloadLink'); [cite: 128]
        const hintText = document.getElementById('hintText'); [cite: 129]
        const promoModal = document.getElementById('promoModal'); [cite: 129]
        const promoIcon = document.getElementById('promoIcon'); [cite: 129]
        const handGuide = document.getElementById('handGuide'); [cite: 129]

        let isShaking = false; [cite: 129]
        const urlParams = new URLSearchParams(window.location.search); [cite: 130]
        const isNewScan = urlParams.get('from') === 'pgy'; [cite: 130]

        function closePromo() {
            promoModal.style.opacity = '0'; [cite: 133]
            setTimeout(() => { promoModal.style.display = 'none'; promoIcon.style.display = 'block'; }, 300); [cite: 134]
        }

        function openPromo() {
            promoIcon.style.display = 'none'; [cite: 135]
            promoModal.style.display = 'flex'; [cite: 136]
            setTimeout(() => { promoModal.style.opacity = '1'; }, 10); [cite: 139]
        }

        if (isNewScan) localStorage.removeItem('selected_fortune_img'); [cite: 140]

        const savedFortune = localStorage.getItem('selected_fortune_img'); [cite: 141]
        if (savedFortune) {
            hintText.innerHTML = "✨您已經求過籤囉✨<br>(點擊查看)"; [cite: 142]
            if(handGuide) handGuide.style.display = 'none'; [cite: 143]
            shaker.addEventListener('click', () => openModalWithImage(savedFortune)); [cite: 143]
        } else {
            shaker.addEventListener('click', startShaking); [cite: 143]
        }

        function startShaking() {
            if (isShaking) return; [cite: 144]
            isShaking = true; [cite: 145]
            if(handGuide) handGuide.style.display = 'none'; [cite: 145]
            shaker.classList.add('is-shaking'); [cite: 145]
            hintText.innerHTML = "虔誠祈福中🙏"; [cite: 145]
            setTimeout(() => { shaker.classList.remove('is-shaking'); generateResult(); isShaking = false; }, 1500); [cite: 146]
        }

        function generateResult() {
            const randomIndex = Math.floor(Math.random() * fortuneImages.length); [cite: 147]
            const selectedImg = fortuneImages[randomIndex]; [cite: 148]
            localStorage.setItem('selected_fortune_img', selectedImg); [cite: 148]
            hintText.innerHTML = "✨您已經求過籤囉✨<br>(點擊查看)"; [cite: 148]
            shaker.removeEventListener('click', startShaking); [cite: 148]
            shaker.addEventListener('click', () => openModalWithImage(selectedImg)); [cite: 148]
            openModalWithImage(selectedImg); [cite: 148]
        }

        function openModalWithImage(imgSrc) {
            resultImage.src = imgSrc; [cite: 149]
            downloadLink.href = imgSrc; [cite: 150]
            modal.style.display = 'flex'; [cite: 150]
            fireConfetti(); [cite: 150]
        }

        function closeModal() { modal.style.display = 'none'; } [cite: 150]

        function shareToLine() {
            const text = "驚喜！！✨我在『唐氏症基金會』321世界唐氏症日抽到神明運勢籤！🧧\n你要不要也來求一支？看看神明跟你說什麼👇"; [cite: 151]
            const lineUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text + "\n" + window.location.href)}`; [cite: 152]
            window.open(lineUrl, '_blank'); [cite: 152]
        }

        function testReset() {
            if(confirm('確定要清除紀錄並重置嗎？')) { localStorage.removeItem('selected_fortune_img'); window.location.href = window.location.pathname; } [cite: 153, 154]
        }

        function fireConfetti() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#bf953f', '#fcf6ba', '#FFD700'] });
        }
    </script>
